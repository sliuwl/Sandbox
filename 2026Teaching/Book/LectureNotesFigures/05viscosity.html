<!DOCTYPE html><html><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: white;
    }

    svg {
      width: 100%;
      max-width: 700px;
      height: auto;
      display: block;
      margin: 0 auto;
    }

    text {
      font-family: Arial, sans-serif;
      fill: #111;
    }
  </style>
</head>
<body>
  <svg viewBox="0 0 700 420">
    <defs>
      <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
        <path d="M0,0 L0,6 L9,3 z" fill="#2563eb"></path>
      </marker>
    </defs>

    <!-- Wall -->
    <rect x="90" y="330" width="520" height="18" fill="#333"></rect>
    <text x="350" y="380" font-size="22" text-anchor="middle">wall, speed = 0</text>

    <!-- Top moving plate -->
    <rect x="90" y="70" width="520" height="18" fill="#333"></rect>
    <line x1="130" y1="45" x2="340" y2="45" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"></line>
    <text x="360" y="52" font-size="24">speed = v</text>

    <!-- Fluid velocity arrows -->
    <line x1="130" y1="290" x2="180" y2="290" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"></line>
    <line x1="130" y1="240" x2="220" y2="240" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"></line>
    <line x1="130" y1="190" x2="260" y2="190" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"></line>
    <line x1="130" y1="140" x2="300" y2="140" stroke="#2563eb" stroke-width="5" marker-end="url(#arrow)"></line>

    <!-- Characteristic length L -->
    <line x1="620" y1="88" x2="620" y2="330" stroke="#111" stroke-width="3"></line>
    <line x1="605" y1="88" x2="635" y2="88" stroke="#111" stroke-width="3"></line>
    <line x1="605" y1="330" x2="635" y2="330" stroke="#111" stroke-width="3"></line>
    <text x="645" y="215" font-size="28">L</text>

    <!-- Gradient label -->
    <text x="350" y="405" font-size="24" text-anchor="middle">velocity gradient ≈ v / L</text>
  </svg>


</body></html>
