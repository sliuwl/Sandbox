<!DOCTYPE html><html lang="zh-CN"><head><meta name="x-poe-datastore-behavior" content="local_only"><meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://code.jquery.com https://unpkg.com https://d3js.org https://threejs.org https://cdn.plot.ly https://stackpath.bootstrapcdn.com https://maps.googleapis.com https://cdn.tailwindcss.com https://ajax.googleapis.com https://kit.fontawesome.com https://cdn.datatables.net https://maxcdn.bootstrapcdn.com https://code.highcharts.com https://tako-static-assets-production.s3.amazonaws.com https://www.youtube.com https://fonts.googleapis.com https://fonts.gstatic.com https://pfst.cf2.poecdn.net https://puc.poecdn.net https://i.imgur.com https://wikimedia.org https://*.icons8.com https://*.giphy.com https://picsum.photos https://images.unsplash.com; frame-src 'self' https://www.youtube.com https://trytako.com; child-src 'self'; manifest-src 'self'; worker-src 'self'; upgrade-insecure-requests; block-all-mixed-content;">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Project Teams</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
        "Helvetica Neue", Arial, "Noto Sans SC", sans-serif;
      background: linear-gradient(135deg, #eef2ff, #f8fafc);
      color: #1e293b;
      min-height: 100vh;
      padding: 24px;
    }

    .container {
      max-width: 1150px;
      margin: 0 auto;
    }

    header {
      text-align: center;
      margin-bottom: 28px;
    }

    header h1 {
      margin: 0 0 8px;
      font-size: 34px;
      color: #1e3a8a;
      letter-spacing: -0.5px;
    }

    header p {
      margin: 0;
      color: #64748b;
      font-size: 16px;
      line-height: 1.6;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 24px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      border: 1px solid #e2e8f0;
    }

    .card h2 {
      margin-top: 0;
      font-size: 20px;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #334155;
    }

    textarea,
    input,
    select {
      width: 100%;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      background: #f8fafc;
      color: #1e293b;
    }

    textarea {
      min-height: 180px;
      resize: vertical;
      line-height: 1.6;
    }

    textarea:focus,
    input:focus,
    select:focus {
      border-color: #2563eb;
      background: white;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
    }

    .hint {
      margin-top: 8px;
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
    }

    .topic-input-row {
      display: flex;
      gap: 10px;
      margin-bottom: 14px;
    }

    .topic-input-row input {
      flex: 1;
    }

    button {
      border: none;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      white-space: nowrap;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
    }

    .btn-primary:hover {
      background: #1d4ed8;
      transform: translateY(-1px);
    }

    .btn-secondary {
      background: #e0e7ff;
      color: #1e3a8a;
    }

    .btn-secondary:hover {
      background: #c7d2fe;
    }

    .btn-danger {
      background: #fee2e2;
      color: #991b1b;
      padding: 7px 10px;
      font-size: 13px;
    }

    .btn-danger:hover {
      background: #fecaca;
    }

    .btn-small {
      padding: 7px 10px;
      font-size: 13px;
    }

    .btn-edit {
      background: #dcfce7;
      color: #166534;
    }

    .btn-edit:hover {
      background: #bbf7d0;
    }

    .btn-save {
      background: #2563eb;
      color: white;
    }

    .btn-save:hover {
      background: #1d4ed8;
    }

    .btn-cancel {
      background: #f1f5f9;
      color: #475569;
    }

    .btn-cancel:hover {
      background: #e2e8f0;
    }

    .settings-card {
      margin-bottom: 24px;
    }

    .settings-row {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 14px;
      align-items: end;
    }

    .topic-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .topic-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      background: #f1f5f9;
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      border-radius: 12px;
    }

    .topic-text {
      flex: 1;
      word-break: break-word;
      line-height: 1.5;
    }

    .topic-actions {
      display: flex;
      gap: 8px;
      flex-shrink: 0;
    }

    .edit-row {
      display: flex;
      flex: 1;
      gap: 8px;
      align-items: center;
    }

    .edit-row input {
      flex: 1;
      padding: 9px 10px;
    }

    .actions {
      text-align: center;
      margin-bottom: 24px;
    }

    .actions button {
      font-size: 17px;
      padding: 14px 26px;
      box-shadow: 0 8px 18px rgba(37, 99, 235, 0.25);
    }

    .summary {
      display: none;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e40af;
      padding: 14px 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      font-weight: 600;
      line-height: 1.6;
    }

    .error {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
      padding: 14px 18px;
      border-radius: 14px;
      margin-bottom: 20px;
      font-weight: 600;
      line-height: 1.6;
    }

    .results {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
    }

    .group-card {
      background: white;
      border-radius: 18px;
      padding: 18px;
      border: 1px solid #e2e8f0;
      box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
      animation: fadeIn 0.35s ease;
    }

    .group-card h3 {
      margin: 0 0 10px;
      color: #1e3a8a;
      font-size: 18px;
    }

    .topic-badge {
      display: inline-block;
      background: #dbeafe;
      color: #1e40af;
      padding: 7px 10px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 12px;
      line-height: 1.4;
    }

    .student-count {
      font-size: 13px;
      color: #64748b;
      margin-bottom: 10px;
    }

    .student-list {
      list-style: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .student-list li {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 10px;
      padding: 8px 10px;
      font-weight: 600;
      color: #334155;
      text-align: center;
    }

    .empty {
      color: #94a3b8;
      font-style: italic;
      font-size: 14px;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      color: #94a3b8;
      font-size: 13px;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .settings-row {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 14px;
      }

      header h1 {
        font-size: 28px;
      }

      .card {
        padding: 18px;
      }

      .topic-input-row,
      .edit-row {
        flex-direction: column;
      }

      .topic-item {
        align-items: stretch;
        flex-direction: column;
      }

      .topic-actions {
        justify-content: flex-end;
      }

      .actions button {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Project Teams</h1>
      <p>
        输入学生学号，添加或编辑 Topic，选择分组数量，然后随机生成项目小组。
      </p>
    </header>

    <section class="card settings-card">
      <h2>⚙️ 分组设置</h2>
      <div class="settings-row">
        <div>
          <label for="groupCount">选择组数</label>
          <select id="groupCount">
            <option value="2">2 组</option>
            <option value="3">3 组</option>
            <option value="4">4 组</option>
            <option value="5" selected="">5 组</option>
            <option value="6">6 组</option>
            <option value="7">7 组</option>
            <option value="8">8 组</option>
          </select>
        </div>
        <div class="hint">
          系统会根据你选择的组数，随机抽取相同数量的 Topic，并将学生平均分配到各组。
        </div>
      </div>
    </section>

    <div class="grid">
      <section class="card">
        <h2>📋 学生学号</h2>
        <label for="studentInput">请输入学生学号</label>
        <textarea id="studentInput" placeholder="例如：
2023001
2023002
2023005
2023010

也可以输入：
2023001, 2023002, 2023005 2023010"></textarea>
        <div class="hint">
          支持换行、空格、中文逗号、英文逗号、分号分隔。学号可以不连续，重复输入会自动去重。
        </div>
      </section>

      <section class="card">
        <h2>🎯 Topic List</h2>
        <label for="topicInput">添加 Topic</label>
        <div class="topic-input-row">
          <input id="topicInput" type="text" placeholder="例如：AI in Education">
          <button class="btn-secondary" onclick="addTopic()">添加</button>
        </div>

        <div class="hint">
          建议添加 5–8 个 Topic。Topic 数量需要不少于选择的组数。
        </div>

        <div id="topicList" class="topic-list"></div>
      </section>
    </div>

    <div id="errorBox" class="error"></div>
    <div id="summaryBox" class="summary"></div>

    <div class="actions">
      <button class="btn-primary" onclick="assignGroups()">🎲 随机分配</button>
    </div>

    <section id="results" class="results"></section>

    <footer>
      每次点击“随机分配”都会重新随机抽取 Topic 并重新分组。
    </footer>
  </div>

  <script>
    const topics = [
      "Taylor, Chapter 12 Nonlinear Mechanics and Chaos",
      "Taylor, Chapter 14 Collision Theory",
      "Taylor, Chapter 15 Special Relativity",
      "Taylor, Chapter 16 Continuum Mechanics",
      "Helliwell, Chapter 14 Complex Systems",
      "Helliwell, Chapter 5 From Classical to Quantum and Back",
      "Helliwell, Chapter 15 Seeds of Quantization"
    ];

    let editingIndex = null;

    const topicInput = document.getElementById("topicInput");
    const topicList = document.getElementById("topicList");
    const results = document.getElementById("results");
    const errorBox = document.getElementById("errorBox");
    const summaryBox = document.getElementById("summaryBox");
    const groupCountSelect = document.getElementById("groupCount");

    function renderTopics() {
      topicList.innerHTML = "";

      if (topics.length === 0) {
        topicList.innerHTML = '<div class="empty">暂无 Topic，请先添加。</div>';
        return;
      }

      topics.forEach((topic, index) => {
        const item = document.createElement("div");
        item.className = "topic-item";

        if (editingIndex === index) {
          const editRow = document.createElement("div");
          editRow.className = "edit-row";

          const input = document.createElement("input");
          input.type = "text";
          input.value = topic;
          input.id = `editTopicInput-${index}`;

          input.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
              event.preventDefault();
              saveTopic(index);
            }

            if (event.key === "Escape") {
              cancelEdit();
            }
          });

          const saveBtn = document.createElement("button");
          saveBtn.className = "btn-save btn-small";
          saveBtn.textContent = "保存";
          saveBtn.onclick = () => saveTopic(index);

          const cancelBtn = document.createElement("button");
          cancelBtn.className = "btn-cancel btn-small";
          cancelBtn.textContent = "取消";
          cancelBtn.onclick = cancelEdit;

          editRow.appendChild(input);
          editRow.appendChild(saveBtn);
          editRow.appendChild(cancelBtn);
          item.appendChild(editRow);

          topicList.appendChild(item);

          setTimeout(() => {
            input.focus();
            input.select();
          }, 0);
        } else {
          const text = document.createElement("div");
          text.className = "topic-text";
          text.textContent = `${index + 1}. ${topic}`;

          const actions = document.createElement("div");
          actions.className = "topic-actions";

          const editBtn = document.createElement("button");
          editBtn.className = "btn-edit btn-small";
          editBtn.textContent = "修改";
          editBtn.onclick = () => startEdit(index);

          const deleteBtn = document.createElement("button");
          deleteBtn.className = "btn-danger";
          deleteBtn.textContent = "删除";
          deleteBtn.onclick = () => {
            topics.splice(index, 1);
            if (editingIndex === index) {
              editingIndex = null;
            }
            renderTopics();
          };

          actions.appendChild(editBtn);
          actions.appendChild(deleteBtn);

          item.appendChild(text);
          item.appendChild(actions);
          topicList.appendChild(item);
        }
      });
    }

    function addTopic() {
      const value = topicInput.value.trim();

      if (!value) {
        showError("请输入 Topic 内容。");
        return;
      }

      if (topics.includes(value)) {
        showError("这个 Topic 已经存在，请添加不同的 Topic。");
        return;
      }

      if (topics.length >= 8) {
        showError("Topic 数量建议最多 8 个。如需添加更多，请先删除或修改已有 Topic。");
        return;
      }

      topics.push(value);
      topicInput.value = "";
      editingIndex = null;
      hideError();
      renderTopics();
    }

    function startEdit(index) {
      editingIndex = index;
      hideError();
      renderTopics();
    }

    function saveTopic(index) {
      const input = document.getElementById(`editTopicInput-${index}`);
      const newValue = input.value.trim();

      if (!newValue) {
        showError("Topic 不能为空。");
        return;
      }

      const duplicate = topics.some((topic, i) => {
        return i !== index && topic === newValue;
      });

      if (duplicate) {
        showError("这个 Topic 已经存在，请输入不同的 Topic。");
        return;
      }

      topics[index] = newValue;
      editingIndex = null;
      hideError();
      renderTopics();
    }

    function cancelEdit() {
      editingIndex = null;
      hideError();
      renderTopics();
    }

    topicInput.addEventListener("keydown", function (event) {
      if (event.key === "Enter") {
        event.preventDefault();
        addTopic();
      }
    });

    function parseStudents() {
      const raw = document.getElementById("studentInput").value.trim();

      if (!raw) return [];

      const students = raw
        .split(/[\s,，;；]+/)
        .map(item => item.trim())
        .filter(Boolean);

      return [...new Set(students)];
    }

    function shuffle(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function assignGroups() {
      hideError();
      summaryBox.style.display = "none";
      results.innerHTML = "";

      const students = parseStudents();
      const groupCount = Number(groupCountSelect.value);

      if (students.length < groupCount) {
        showError(`学生人数至少需要 ${groupCount} 人，才能分成 ${groupCount} 组。`);
        return;
      }

      if (topics.length < groupCount) {
        showError(`当前只有 ${topics.length} 个 Topic。选择 ${groupCount} 组时，至少需要 ${groupCount} 个 Topic。`);
        return;
      }

      const shuffledStudents = shuffle(students);
      const selectedTopics = shuffle(topics).slice(0, groupCount);

      const groups = Array.from({ length: groupCount }, (_, index) => ({
        groupNumber: index + 1,
        topic: selectedTopics[index],
        students: []
      }));

      shuffledStudents.forEach((student, index) => {
        groups[index % groupCount].students.push(student);
      });

      renderResults(groups, students.length, groupCount);
    }

    function renderResults(groups, totalStudents, groupCount) {
      results.innerHTML = "";

      groups.forEach(group => {
        const card = document.createElement("div");
        card.className = "group-card";

        const title = document.createElement("h3");
        title.textContent = `第 ${group.groupNumber} 组`;

        const topic = document.createElement("div");
        topic.className = "topic-badge";
        topic.textContent = group.topic;

        const count = document.createElement("div");
        count.className = "student-count";
        count.textContent = `人数：${group.students.length}`;

        const list = document.createElement("ul");
        list.className = "student-list";

        group.students.forEach(student => {
          const li = document.createElement("li");
          li.textContent = student;
          list.appendChild(li);
        });

        card.appendChild(title);
        card.appendChild(topic);
        card.appendChild(count);
        card.appendChild(list);

        results.appendChild(card);
      });

      const sizes = groups.map(group => group.students.length);
      const maxSize = Math.max(...sizes);
      const minSize = Math.min(...sizes);

      summaryBox.innerHTML = `
        分配完成：共 ${totalStudents} 名学生，分为 ${groupCount} 组。<br>
        每组人数范围：${minSize}–${maxSize} 人。Topic 已从当前列表中随机抽取 ${groupCount} 个。
      `;
      summaryBox.style.display = "block";
    }

    function showError(message) {
      errorBox.textContent = message;
      errorBox.style.display = "block";
    }

    function hideError() {
      errorBox.textContent = "";
      errorBox.style.display = "none";
    }

    renderTopics();
  </script>


</body></html>
